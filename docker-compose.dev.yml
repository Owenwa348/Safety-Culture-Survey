version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: safety-survey-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - safety-survey-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API - Development mode with hot reload
  backend:
    image: node:20-alpine
    container_name: safety-survey-backend-dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      PORT: 5000
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./Backend Safety-Culture-Survey:/app
      - /app/node_modules
    networks:
      - safety-survey-network
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npx nodemon --legacy-watch server.js"

  # Frontend - Development mode with hot reload
  frontend:
    image: node:20-alpine
    container_name: safety-survey-frontend-dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    ports:
      # vite.config.ts ตั้ง server.port = 5174 จึงต้อง map ให้ตรงกัน
      - "5174:5174"
    volumes:
      - ./Frontend Safety-Culture-Survey:/app
      - /app/node_modules
    networks:
      - safety-survey-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

networks:
  safety-survey-network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
