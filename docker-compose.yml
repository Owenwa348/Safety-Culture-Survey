version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./Backend Safety-Culture-Survey
      dockerfile: Dockerfile
    container_name: safety-survey-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      NODE_ENV: production
    # nginx เรียก backend ผ่าน docker network (http://backend:5000)
    # เปิด port ออกข้างนอกไว้สำหรับ debug เท่านั้น — ถ้าไม่ต้องการให้เข้าถึง API ตรง ๆ
    # จากภายนอก ให้เปลี่ยนเป็น expose: ["5000"]
    ports:
      - "5000:5000"
    networks:
      - safety-survey-network
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && node server.js"

  # Frontend
  frontend:
    build:
      context: ./Frontend Safety-Culture-Survey
      dockerfile: Dockerfile
    container_name: safety-survey-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - safety-survey-network

networks:
  safety-survey-network:
    driver: bridge
